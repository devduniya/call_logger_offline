name: Build and Email

# Modular build tool: detects the project type (native Android, Flutter, Expo,
# bare React Native, or native iOS/Swift) and runs the matching build. On success
# it publishes the result as a GitHub Release and emails a download link via Resend.
# See the "Automated builds (CI/CD)" section in README.md for setup instructions.

on:
  push:
    branches: [ deployment ]
  workflow_dispatch:
    inputs:
      build_type:
        description: "Which variant(s) to build (ignored for iOS). 'both' skips release gracefully if signing secrets are missing."
        required: true
        default: both
        type: choice
        options: [debug, release, both]
      platform_override:
        description: "Force a project type instead of auto-detecting"
        required: true
        default: auto
        type: choice
        options: [auto, android, flutter, expo, react-native, ios]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  detect:
    name: Detect project type
    runs-on: ubuntu-latest
    outputs:
      project_type: ${{ steps.detect.outputs.type }}
    steps:
      - uses: actions/checkout@v4

      - id: detect
        run: |
          OVERRIDE="${{ inputs.platform_override }}"
          if [ -n "$OVERRIDE" ] && [ "$OVERRIDE" != "auto" ]; then
            echo "type=$OVERRIDE" >> "$GITHUB_OUTPUT"
            echo "Using manual override: $OVERRIDE"
            exit 0
          fi

          if [ -f pubspec.yaml ] && grep -q "flutter:" pubspec.yaml; then
            TYPE=flutter
          elif [ -f package.json ] && grep -q '"expo"' package.json; then
            TYPE=expo
          elif [ -f package.json ] && grep -q '"react-native"' package.json; then
            TYPE=react-native
          elif find . -maxdepth 2 -iname "*.xcodeproj" 2>/dev/null | grep -q . || \
               find . -maxdepth 2 -iname "*.xcworkspace" 2>/dev/null | grep -q . || \
               [ -f Package.swift ]; then
            TYPE=ios
          elif [ -f settings.gradle ] || [ -f settings.gradle.kts ]; then
            TYPE=android
          else
            TYPE=unknown
          fi
          echo "type=$TYPE" >> "$GITHUB_OUTPUT"
          echo "Detected project type: $TYPE"

  build-android:
    name: Build (native Android)
    needs: detect
    if: needs.detect.outputs.project_type == 'android'
    runs-on: ubuntu-latest
    env:
      BUILD_TYPE: ${{ github.event_name == 'workflow_dispatch' && inputs.build_type || 'both' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install pinned Android NDK and CMake
        run: |
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --install "ndk;27.0.12077973" "cmake;3.22.1"
          set -o pipefail

      - name: Check release signing availability
        id: signing_check
        if: env.BUILD_TYPE == 'release' || env.BUILD_TYPE == 'both'
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=()
          [ -z "$KS" ] && missing+=("ANDROID_KEYSTORE_BASE64")
          [ -z "$KS_PW" ] && missing+=("ANDROID_KEYSTORE_PASSWORD")
          [ -z "$KEY_ALIAS" ] && missing+=("ANDROID_KEY_ALIAS")
          [ -z "$KEY_PW" ] && missing+=("ANDROID_KEY_PASSWORD")
          if [ ${#missing[@]} -eq 0 ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "available=false" >> "$GITHUB_OUTPUT"
          if [ "$BUILD_TYPE" = "release" ]; then
            echo "::error::Release build requested but these repo secrets are not set: ${missing[*]}. Add them under Settings > Secrets and variables > Actions, then re-run."
            exit 1
          fi
          echo "::warning::Release signing secrets are not set (missing: ${missing[*]}) — only the debug APK will be built and emailed this run. Add them to also get a signed release build."

      - name: Configure release signing
        if: steps.signing_check.outputs.available == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          KEYSTORE_PATH="${GITHUB_WORKSPACE}/release.keystore.jks"
          echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
          {
            echo "storeFile=${KEYSTORE_PATH}"
            echo "storePassword=${KEYSTORE_PASSWORD}"
            echo "keyAlias=${KEY_ALIAS}"
            echo "keyPassword=${KEY_PASSWORD}"
          } > "${GITHUB_WORKSPACE}/key.properties"

      - name: Build debug APK
        if: env.BUILD_TYPE == 'debug' || env.BUILD_TYPE == 'both'
        run: ./gradlew assembleDebug --stacktrace

      - name: Build release APK
        if: steps.signing_check.outputs.available == 'true' && (env.BUILD_TYPE == 'release' || env.BUILD_TYPE == 'both')
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload build output
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore
          retention-days: 7

  build-flutter:
    name: Build (Flutter)
    needs: detect
    if: needs.detect.outputs.project_type == 'flutter'
    runs-on: ubuntu-latest
    env:
      BUILD_TYPE: ${{ github.event_name == 'workflow_dispatch' && inputs.build_type || 'both' }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - run: flutter pub get

      - name: Build debug APK
        if: env.BUILD_TYPE == 'debug' || env.BUILD_TYPE == 'both'
        run: flutter build apk --debug

      - name: Build release APK
        if: env.BUILD_TYPE == 'release' || env.BUILD_TYPE == 'both'
        run: flutter build apk --release

      - name: Upload build output
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: ignore
          retention-days: 7

  build-expo:
    name: Build (Expo)
    needs: detect
    if: needs.detect.outputs.project_type == 'expo'
    runs-on: ubuntu-latest
    env:
      BUILD_TYPE: ${{ github.event_name == 'workflow_dispatch' && inputs.build_type || 'both' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - run: npm ci

      - name: Prebuild native Android project
        run: npx expo prebuild --platform android --non-interactive

      - name: Build debug APK
        if: env.BUILD_TYPE == 'debug' || env.BUILD_TYPE == 'both'
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Build release APK
        if: env.BUILD_TYPE == 'release' || env.BUILD_TYPE == 'both'
        working-directory: android
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload build output
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore
          retention-days: 7

  build-react-native:
    name: Build (React Native)
    needs: detect
    if: needs.detect.outputs.project_type == 'react-native'
    runs-on: ubuntu-latest
    env:
      BUILD_TYPE: ${{ github.event_name == 'workflow_dispatch' && inputs.build_type || 'both' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - run: npm ci

      - name: Build debug APK
        if: env.BUILD_TYPE == 'debug' || env.BUILD_TYPE == 'both'
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Build release APK
        if: env.BUILD_TYPE == 'release' || env.BUILD_TYPE == 'both'
        working-directory: android
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload build output
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore
          retention-days: 7

  build-ios:
    name: Build (iOS / Swift)
    needs: detect
    if: needs.detect.outputs.project_type == 'ios'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect scheme
        id: scheme
        run: |
          SCHEME=$(xcodebuild -list -json | python3 -c "import json,sys; d=json.load(sys.stdin); print((d.get('project') or d.get('workspace'))['schemes'][0])")
          echo "name=$SCHEME" >> "$GITHUB_OUTPUT"
          echo "Detected scheme: $SCHEME"

      # Real-device signing is optional: only attempted if all three Apple secrets are present.
      # Without them, this falls back to a Simulator build, which needs no signing at all.
      - name: Import Apple signing (optional)
        id: signing
        env:
          P12_BASE64: ${{ secrets.APPLE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_P12_PASSWORD }}
          PROVISION_BASE64: ${{ secrets.APPLE_PROVISION_BASE64 }}
        run: |
          if [ -z "$P12_BASE64" ] || [ -z "$PROVISION_BASE64" ]; then
            echo "have_signing=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          echo "$P12_BASE64" | base64 -d > cert.p12
          security import cert.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign
          security list-keychain -d user -s build.keychain
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROVISION_BASE64" | base64 -d > ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision
          echo "have_signing=true" >> "$GITHUB_OUTPUT"

      - name: Build for Simulator (no signing needed)
        if: steps.signing.outputs.have_signing != 'true'
        run: |
          xcodebuild -scheme "${{ steps.scheme.outputs.name }}" -sdk iphonesimulator \
            -configuration Debug -derivedDataPath build build CODE_SIGNING_ALLOWED=NO
          cd build/Build/Products/Debug-iphonesimulator
          APP=$(find . -maxdepth 1 -iname "*.app" | head -n1)
          zip -r "${GITHUB_WORKSPACE}/build-output.zip" "$APP"

      - name: Archive and export signed IPA
        if: steps.signing.outputs.have_signing == 'true'
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild -scheme "${{ steps.scheme.outputs.name }}" -configuration Release \
            -archivePath build/app.xcarchive archive
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>ad-hoc</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive -archivePath build/app.xcarchive \
            -exportPath build/ipa -exportOptionsPlist build/ExportOptions.plist
          cd build/ipa
          zip -r "${GITHUB_WORKSPACE}/build-output.zip" .

      - name: Upload build output
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: build-output.zip
          if-no-files-found: ignore
          retention-days: 7

  release-and-notify:
    name: Publish release and email
    needs: [detect, build-android, build-flutter, build-expo, build-react-native, build-ios]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - id: outcome
        run: |
          if [ "${{ needs.build-android.result }}" = "success" ] || \
             [ "${{ needs.build-flutter.result }}" = "success" ] || \
             [ "${{ needs.build-expo.result }}" = "success" ] || \
             [ "${{ needs.build-react-native.result }}" = "success" ] || \
             [ "${{ needs.build-ios.result }}" = "success" ]; then
            echo "success=true" >> "$GITHUB_OUTPUT"
          else
            echo "success=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout commit history
        if: steps.outcome.outputs.success == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 5

      - name: Download build output
        if: steps.outcome.outputs.success == 'true'
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: build-output

      - name: Create GitHub Release
        if: steps.outcome.outputs.success == 'true'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: build-${{ github.run_number }}
          name: "Build #${{ github.run_number }} (${{ needs.detect.outputs.project_type }})"
          files: build-output/**
          body: |
            Automated build from commit ${{ github.sha }} on `${{ github.ref_name }}`.
            Detected project type: ${{ needs.detect.outputs.project_type }}

      - name: Verify email configuration
        if: steps.outcome.outputs.success == 'true'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_TO: ${{ secrets.MAIL_TO || vars.MAIL_TO }}
        run: |
          missing=()
          [ -z "$RESEND_API_KEY" ] && missing+=("RESEND_API_KEY (Secret)")
          [ -z "$MAIL_TO" ] && missing+=("MAIL_TO (Secret or Variable)")
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Build succeeded but can't email it: not set in this repo: ${missing[*]}. Add under Settings > Secrets and variables > Actions. MAIL_TO can be either a Secret or a Variable (Secret is checked first, Variable is used only if no Secret is set) — Variable is fine since it's just a recipient address; RESEND_API_KEY must be a Secret since it's a real credential."
            exit 1
          fi

      - name: Email the build
        if: steps.outcome.outputs.success == 'true'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_TO: ${{ secrets.MAIL_TO || vars.MAIL_TO }}
          MAIL_FROM: ${{ secrets.MAIL_FROM || vars.MAIL_FROM }}
        run: |
          TAG="build-${{ github.run_number }}"
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${TAG}"
          FROM="${MAIL_FROM:-Build Bot <onboarding@resend.dev>}"
          COMMITS_HTML=$(git log -5 --format=%s | jq -Rsc '
            split("\n")
            | map(select(length > 0))
            | map("<li style=\"padding:6px 0;color:#334155;\">" + (gsub("&"; "\u0026amp;") | gsub("<"; "\u0026lt;") | gsub(">"; "\u0026gt;")) + "</li>")
            | join("")
          ')

          # One <li> per built file (debug + release both land here when both were built),
          # each linking straight to its own GitHub Release asset download URL.
          LINKS_HTML=""
          while IFS= read -r f; do
            NAME=$(basename "$f")
            URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/${NAME}"
            case "$NAME" in
              *debug*) LABEL="Debug build" ;;
              *release*) LABEL="Release build" ;;
              *) LABEL="Build" ;;
            esac
            LINKS_HTML="${LINKS_HTML}<li style=\"padding:8px 0;\"><a href=\"${URL}\" style=\"color:#2563eb;font-weight:600;text-decoration:none;\">${LABEL} &mdash; ${NAME}</a></li>"
          done < <(find build-output -type f | sort)

          RESPONSE=$(curl -sS -w '\n%{http_code}' -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg from "$FROM" \
              --arg to "$MAIL_TO" \
              --arg url "$RELEASE_URL" \
              --arg repo "${{ github.repository }}" \
              --arg type "${{ needs.detect.outputs.project_type }}" \
              --arg sha "${{ github.sha }}" \
              --arg branch "${{ github.ref_name }}" \
              --arg links "$LINKS_HTML" \
              --arg commits "$COMMITS_HTML" \
              '{
                from: $from,
                to: [$to],
                subject: ("Build ready: " + $repo + " (" + $type + ")"),
                html: (
                  "<div style=\"margin:0;padding:32px 12px;background:#f1f5f9;font-family:Arial,sans-serif;color:#0f172a;\">" +
                  "<div style=\"max-width:600px;margin:0 auto;background:#fff;border:1px solid #e2e8f0;border-radius:12px;overflow:hidden;\">" +
                  "<div style=\"padding:24px 28px;background:#0f172a;color:#fff;\">" +
                  "<p style=\"margin:0 0 8px;color:#93c5fd;font-size:12px;font-weight:700;letter-spacing:1px;\">BUILD COMPLETE</p>" +
                  "<h1 style=\"margin:0;font-size:24px;\">Your " + ($type | @html) + " build is ready</h1></div>" +
                  "<div style=\"padding:24px 28px;\">" +
                  "<p style=\"margin:0 0 18px;color:#475569;\">" + ($repo | @html) + " &nbsp;·&nbsp; " + ($branch | @html) + "</p>" +
                  "<h2 style=\"margin:0 0 8px;font-size:16px;\">Downloads</h2>" +
                  "<ul style=\"margin:0 0 24px;padding-left:20px;\">" + $links + "</ul>" +
                  "<h2 style=\"margin:0 0 8px;font-size:16px;\">Last 5 commits</h2>" +
                  "<ol style=\"margin:0 0 22px;padding-left:22px;\">" + $commits + "</ol>" +
                  "<p style=\"margin:0;font-size:13px;color:#64748b;\">Built from commit <a href=\"https://github.com/" + $repo + "/commit/" + $sha + "\" style=\"color:#2563eb;text-decoration:none;\">" + ($sha | .[0:7]) + "</a></p>" +
                  "<p style=\"margin:20px 0 0;\"><a href=\"" + $url + "\" style=\"display:inline-block;padding:11px 16px;background:#2563eb;color:#fff;border-radius:7px;text-decoration:none;font-weight:600;\">View release</a></p>" +
                  "</div></div></div>"
                )
              }')")
          HTTP_STATUS="${RESPONSE##*$'\n'}"
          RESPONSE_BODY="${RESPONSE%$'\n'*}"

          if [[ ! "$HTTP_STATUS" =~ ^2[0-9][0-9]$ ]]; then
            echo "::error::Resend email request failed (HTTP ${HTTP_STATUS}). See the response body below."
            printf '%s\n' "$RESPONSE_BODY"
            if [ "$HTTP_STATUS" = "403" ]; then
              echo "::error::A common cause is using the onboarding@resend.dev sandbox sender for a recipient other than your Resend account email. To email another address, verify a sending domain in Resend and set MAIL_FROM to an address on that domain (as a GitHub Secret or Variable)."
            fi
            exit 1
          fi
